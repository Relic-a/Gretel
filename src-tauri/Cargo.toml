[package]
name = "gretel"
version = "0.4.1-beta.1"
description = "Gretel desktop app"
authors = ["Ezana"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "gretel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
getrandom = "0.3"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_JobObjects", "Win32_Security", "Win32_Foundation", "Win32_System_Threading"] }
