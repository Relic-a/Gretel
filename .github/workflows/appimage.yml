name: Build portable Linux packages

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to build and update
        required: true
        type: string

permissions:
  contents: write

jobs:
  appimage:
    name: Build and attach AppImage
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Generate package icons
        run: npm run generate:icons

      - name: Build AppImage
        run: npm run tauri -- build --target x86_64-unknown-linux-gnu --bundles appimage --verbose

      - name: Verify AppImage
        shell: bash
        run: |
          appimages=(src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage)
          test "${#appimages[@]}" -eq 1
          test -s "${appimages[0]}"
          file "${appimages[0]}"

      - name: Attach AppImage to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.release_tag }}
          fail_on_unmatched_files: true
          files: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage

  arch-package:
    name: Build and attach Arch package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      GRETEL_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

    steps:
      - name: Check out packaging tools
        uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: pacman -Syu --noconfirm --needed curl git

      - name: Download verified Debian payload
        shell: bash
        run: |
          if [[ ! "$GRETEL_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $GRETEL_RELEASE_TAG" >&2
            exit 1
          fi
          gretel_version="${GRETEL_RELEASE_TAG#v}"
          deb_name="Gretel_${gretel_version}_amd64.deb"
          curl --fail --location --retry 4 \
            --output "$deb_name" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GRETEL_RELEASE_TAG}/${deb_name}"
          echo "GRETEL_DEB_PATH=${GITHUB_WORKSPACE}/${deb_name}" >> "$GITHUB_ENV"

      - name: Build pacman package
        shell: bash
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash scripts/package-arch-release.sh \
            "$GRETEL_RELEASE_TAG" \
            "$GRETEL_DEB_PATH" \
            "$GITHUB_WORKSPACE/arch-package"

      - name: Verify pacman package
        shell: bash
        run: |
          packages=(arch-package/*-x86_64.pkg.tar.zst)
          test "${#packages[@]}" -eq 1
          test -s "${packages[0]}"
          pacman --query --print-format '%n %v %a' --file "${packages[0]}"
          bsdtar -tf "${packages[0]}" | grep -Fxq '.PKGINFO'
          bsdtar -tf "${packages[0]}" | grep -Fxq 'usr/bin/gretel'

      - name: Attach pacman package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.release_tag }}
          fail_on_unmatched_files: true
          files: arch-package/*-x86_64.pkg.tar.zst
