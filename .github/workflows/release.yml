name: Build release packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            command: npm run dist:linux
            artifacts: |
              dist/*.AppImage
              dist/*.deb
              dist/latest-linux.yml
          - name: Windows
            os: windows-latest
            command: npm run dist:win
            artifacts: |
              dist/*.exe
              dist/latest.yml
          - name: macOS
            os: macos-latest
            command: npm run dist:mac
            artifacts: |
              dist/*.dmg
              dist/*.zip
              dist/latest-mac.yml

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: ${{ matrix.command }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gretel-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

      - name: Upload files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: ${{ matrix.artifacts }}
