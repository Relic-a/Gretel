name: Build release packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            command: npm run dist:linux
            artifacts: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.sig
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.sig
          - name: Windows
            os: windows-latest
            command: npm run dist:win
            artifacts: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig
          - name: macOS
            os: macos-latest
            command: npm run dist:mac
            artifacts: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app.tar.gz
              src-tauri/target/release/bundle/macos/*.sig

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Generate package icons
        run: npm run generate:icons

      - name: Build package
        run: ${{ matrix.command }}

      - name: Verify Linux package media dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          debs=(src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb)
          rpms=(src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm)
          test "${#debs[@]}" -eq 1
          test "${#rpms[@]}" -eq 1

          deb_dependencies=$(dpkg-deb --field "${debs[0]}" Depends)
          for dependency in gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav; do
            grep -Eq "(^|, )${dependency}(,|$)" <<< "$deb_dependencies"
          done

          rpm_requirements=$(rpm --query --package --requires "${rpms[0]}")
          for dependency in gstreamer1-plugins-base gstreamer1-plugins-good gstreamer1-plugins-bad-free gstreamer1-plugin-openh264; do
            grep -Fxq "$dependency" <<< "$rpm_requirements"
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gretel-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  appimage:
    name: Build signed AppImage updater
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - name: Install dependencies
        run: npm ci

      - name: Prepare AppImage resources
        run: |
          npm run tauri:prepare
          node -e '
            const { existsSync, readdirSync, rmSync } = require("node:fs");
            const path = require("node:path");
            for (const root of [path.resolve(".next/standalone/node_modules/@img"), path.resolve(".next/standalone/.next/node_modules/@img")]) {
              if (!existsSync(root)) continue;
              for (const entry of readdirSync(root, { withFileTypes: true })) {
                if (entry.isDirectory() && entry.name.includes("linuxmusl")) rmSync(path.join(root, entry.name), { recursive: true, force: true });
              }
            }
          '

      - name: Build signed AppImage updater
        run: npm run tauri -- build --target x86_64-unknown-linux-gnu --bundles appimage --config '{"build":{"beforeBuildCommand":"true"}}'

      - name: Upload AppImage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Gretel-AppImage
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.sig
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, appimage]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Tauri installers
        uses: actions/download-artifact@v4
        with:
          pattern: Gretel-*
          path: release-assets
          merge-multiple: true

      - name: Build updater manifest
        run: node scripts/create-updater-manifest.mjs release-assets "${{ github.ref_name }}" "${{ github.repository }}" latest.json

      - name: Publish Tauri installers
        uses: softprops/action-gh-release@v2
        with:
          name: Gretel ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*
            latest.json
