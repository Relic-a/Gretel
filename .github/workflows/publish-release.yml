name: Publish existing release artifacts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish
        required: true
        type: string
      artifact_run_id:
        description: Successful build run containing Gretel artifacts
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Check out manifest tooling
        uses: actions/checkout@v4

      - name: Download Tauri installers
        uses: actions/download-artifact@v4
        with:
          pattern: Gretel-*
          path: release-assets
          merge-multiple: true
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build updater manifest
        run: node scripts/create-updater-manifest.mjs release-assets "${{ inputs.release_tag }}" "${{ github.repository }}" latest.json

      - name: Publish Tauri installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Gretel ${{ inputs.release_tag }}
          generate_release_notes: true
          prerelease: ${{ contains(inputs.release_tag, '-') }}
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*
            latest.json
