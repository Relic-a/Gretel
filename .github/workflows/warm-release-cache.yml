name: Warm Linux release cache

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: warm-linux-release-cache
  cancel-in-progress: true

jobs:
  linux:
    name: Compile Linux release binary
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-linux
          cache-workspace-crates: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - run: npm ci
      - run: npm run tauri:prepare
      - name: Compile the release target without bundling
        run: npm run tauri -- build --target x86_64-unknown-linux-gnu --no-bundle --config '{"build":{"beforeBuildCommand":"true"}}'
