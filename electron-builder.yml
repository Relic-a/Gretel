appId: com.ezana.gretel
productName: Gretel
copyright: Copyright © 2026
directories:
  app: package
  output: dist
  buildResources: build
files:
  - "dist-electron/**"
  - "dist-renderer/**"
  - "config/**"
  - "!build/**"
electronDownload:
  cache: .cache/electron
asar: true
npmRebuild: false
asarUnpack:
  - "**/*.node"
linux:
  target:
    - deb
    - AppImage
  category: AudioVideo
  maintainer: Ezana <ezana@example.com>
  icon: build/icon.png
  artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
  synopsis: Curate your YouTube feed
  description: Curate your YouTube feed
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
  artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeader: build/icon.png
  installerSidebar: build/icon.png
  uninstallerSidebar: build/icon.png
mac:
  target:
    - dmg
    - zip
  category: public.app-category.entertainment
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
